<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Perfil | Biblioteca</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,600;14..32,700&display=swap" rel="stylesheet">
    <script src="js/protect.js"></script>
    <script src="js/app.js"></script>
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background: #f7f3e8;
            background-image: radial-gradient(circle at 25% 40%, rgba(210, 180, 140, 0.08) 2%, transparent 2.5%);
            background-size: 24px 24px;
        }
        .input-field {
            transition: all 0.2s;
        }
        .input-field:focus {
            ring: 2px solid #d97706;
            border-color: transparent;
        }
    </style>
</head>
<body class="min-h-screen">

    <div class="max-w-2xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
        <!-- Header -->
        <div class="flex items-center gap-3 mb-8">
            <a href="dashboard.html" class="text-amber-700 hover:text-amber-900 transition">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18" />
                </svg>
            </a>
            <h1 class="text-3xl md:text-4xl font-bold text-amber-800">👤 Mi Perfil</h1>
        </div>

        <!-- Información del usuario -->
        <div id="perfilContainer" class="space-y-6">
            <!-- Loading -->
            <div class="bg-white rounded-xl shadow-sm p-8 text-center">
                <div class="animate-spin rounded-full h-12 w-12 border-4 border-amber-500 border-t-transparent mx-auto"></div>
                <p class="mt-4 text-gray-500">Cargando perfil...</p>
            </div>
        </div>

        <!-- Mensaje de éxito -->
        <div id="mensajeExito" class="hidden fixed top-4 right-4 bg-green-100 border-l-4 border-green-500 text-green-700 p-4 rounded shadow-lg z-50">
            ✅ Cambios guardados correctamente
        </div>
    </div>

    <script>
        checkAuth();
        let usuarioActual = null;

        // Cargar datos del usuario actual
        async function cargarPerfil() {
            try {
                const res = await apiFetch("http://127.0.0.1:8000/auth/me");
                if (res.ok) {
                    usuarioActual = await res.json();
                    renderizarPerfil(usuarioActual);
                } else {
                    mostrarError("Error al cargar el perfil");
                }
            } catch (error) {
                console.error("Error:", error);
                mostrarError("Error de conexión");
            }
        }

        // Renderizar el perfil del usuario
        function renderizarPerfil(usuario) {
            const container = document.getElementById("perfilContainer");
            const role = localStorage.getItem("role");

            // Obtener datos de la persona relacionada
            let nombre = "Sin asignar";
            let documento = "";
            let telefono = "";
            let direccion = "";
            const puedeCambiarContrasena = role === "Administrador";

            if (usuario.persona_rel) {
                nombre = usuario.persona_rel.Nombre || nombre;
                documento = usuario.persona_rel.Cedula || "";
                telefono = usuario.persona_rel.Telefono || "";
                direccion = usuario.persona_rel.Direccion || "";
            }

            const iniciales = nombre.charAt(0).toUpperCase();

            container.innerHTML = `
                <!-- Avatar y基本信息 -->
                <div class="bg-white rounded-xl shadow-sm p-6 border border-amber-100">
                    <div class="flex items-center gap-6">
                        <div class="h-20 w-20 bg-gradient-to-br from-amber-400 to-amber-600 rounded-full flex items-center justify-center text-3xl font-bold text-white shadow-lg">
                            ${iniciales}
                        </div>
                        <div>
                            <h2 class="text-2xl font-bold text-gray-800">${escapeHtml(nombre)}</h2>
                            <p class="text-gray-500">${escapeHtml(usuario.Correo)}</p>
                            <span class="inline-block mt-2 px-3 py-1 bg-amber-100 text-amber-700 rounded-full text-sm font-medium">
                                ${role}
                            </span>
                        </div>
                    </div>
                </div>

                <!-- Datos del usuario -->
                <div class="bg-white rounded-xl shadow-sm p-6 border border-amber-100">
                    <h3 class="text-lg font-bold text-gray-800 mb-4 flex items-center gap-2">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 text-amber-600" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" />
                        </svg>
                        Datos de Cuenta
                    </h3>
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <div>
                            <label class="block text-sm font-medium text-gray-500 mb-1">Código de Usuario</label>
                            <div class="text-gray-800 font-semibold">#${usuario.Cod_usuario}</div>
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-500 mb-1">Correo Electrónico</label>
                            <div class="text-gray-800">${escapeHtml(usuario.Correo)}</div>
                        </div>
                    </div>
                </div>

                <!-- Datos personales (si existen) -->
                <div class="bg-white rounded-xl shadow-sm p-6 border border-amber-100">
                    <h3 class="text-lg font-bold text-gray-800 mb-4 flex items-center gap-2">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 text-amber-600" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z" />
                        </svg>
                        Información Personal
                    </h3>
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <div>
                            <label class="block text-sm font-medium text-gray-500 mb-1">Nombre Completo</label>
                            <div class="text-gray-800">${escapeHtml(nombre)}</div>
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-500 mb-1">Número de Documento</label>
                            <div class="text-gray-800">${documento || '<span class="text-gray-400">No registrado</span>'}</div>
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-500 mb-1">Teléfono</label>
                            <div class="text-gray-800">${telefono || '<span class="text-gray-400">No registrado</span>'}</div>
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-500 mb-1">Dirección</label>
                            <div class="text-gray-800">${direccion || '<span class="text-gray-400">No registrada</span>'}</div>
                        </div>
                    </div>
                </div>

                ${puedeCambiarContrasena ? `
                <!-- Cambiar contraseña -->
                <div class="bg-white rounded-xl shadow-sm p-6 border border-amber-100">
                    <h3 class="text-lg font-bold text-gray-800 mb-4 flex items-center gap-2">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 text-amber-600" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 7a2 2 0 012 2m4 0a6 6 0 01-7.743 5.743L11 17H9v2H7v2H4a1 1 0 01-1-1v-2.586a1 1 0 01.293-.707l5.964-5.964A6 6 0 1121 9z" />
                        </svg>
                        Cambiar Contraseña
                    </h3>
                    <div class="space-y-4">
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">Contraseña Actual</label>
                            <input type="password" id="passwordActual" class="input-field w-full border border-gray-300 rounded-lg px-4 py-2.5 focus:ring-2 focus:ring-amber-400" placeholder="Ingresa tu contraseña actual">
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">Nueva Contraseña</label>
                            <input type="password" id="passwordNueva" class="input-field w-full border border-gray-300 rounded-lg px-4 py-2.5 focus:ring-2 focus:ring-amber-400" placeholder="Mínimo 8 caracteres">
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">Confirmar Nueva Contraseña</label>
                            <input type="password" id="passwordConfirmar" class="input-field w-full border border-gray-300 rounded-lg px-4 py-2.5 focus:ring-2 focus:ring-amber-400" placeholder="Repite la nueva contraseña">
                        </div>
                        <button onclick="cambiarContrasena()" class="w-full bg-amber-600 hover:bg-amber-700 text-white py-2.5 rounded-lg font-medium transition">
                            Actualizar Contraseña
                        </button>
                    </div>
                </div>
                ` : `
                <div class="bg-white rounded-xl shadow-sm p-6 border border-amber-100">
                    <p class="text-gray-700">Solo un administrador puede cambiar contraseñas de usuarios.</p>
                </div>
                `}

                <!-- Cerrar sesión -->
                <div class="bg-white rounded-xl shadow-sm p-6 border border-amber-100">
                    <h3 class="text-lg font-bold text-gray-800 mb-4 flex items-center gap-2">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 text-red-600" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1" />
                        </svg>
                        Sesión
                    </h3>
                    <button onclick="cerrarSesion()" class="w-full bg-red-50 hover:bg-red-100 text-red-600 py-2.5 rounded-lg font-medium transition border border-red-200">
                        Cerrar Sesión
                    </button>
                </div>
            `;
        }

        // Cambiar contraseña
        async function cambiarContrasena() {
            const passwordActual = document.getElementById("passwordActual").value;
            const passwordNueva = document.getElementById("passwordNueva").value;
            const passwordConfirmar = document.getElementById("passwordConfirmar").value;

            // Validaciones
            if (!passwordActual || !passwordNueva || !passwordConfirmar) {
                alert("❌ Por favor completa todos los campos");
                return;
            }

            if (passwordNueva.length < 8) {
                alert("❌ La nueva contraseña debe tener al menos 8 caracteres");
                return;
            }

            if (passwordNueva !== passwordConfirmar) {
                alert("❌ Las contraseñas no coinciden");
                return;
            }

            if (passwordActual === passwordNueva) {
                alert("❌ La nueva contraseña debe ser diferente a la actual");
                return;
            }

            try {
                // Verificar contraseña actual haciendo login
                const formData = new URLSearchParams();
                formData.append("username", usuarioActual.Correo);
                formData.append("password", passwordActual);

                const loginRes = await fetch("http://127.0.0.1:8000/auth/login", {
                    method: "POST",
                    headers: { "Content-Type": "application/x-www-form-urlencoded" },
                    body: formData
                });

                if (!loginRes.ok) {
                    alert("❌ La contraseña actual es incorrecta");
                    return;
                }

                // Actualizar contraseña
                const res = await apiFetch(`http://127.0.0.1:8000/usuarios/${usuarioActual.Id}`, {
                    method: "PUT",
                    body: JSON.stringify({ Contraseña: passwordNueva })
                });

                if (res.ok) {
                    mostrarMensajeExito();
                    // Limpiar campos
                    document.getElementById("passwordActual").value = "";
                    document.getElementById("passwordNueva").value = "";
                    document.getElementById("passwordConfirmar").value = "";
                } else {
                    const error = await res.json();
                    alert("❌ " + (error.detail || "Error al cambiar la contraseña"));
                }
            } catch (error) {
                console.error("Error:", error);
                alert("❌ Error de conexión");
            }
        }

        // Cerrar sesión
        function cerrarSesion() {
            if (confirm("¿Estás seguro de que quieres cerrar sesión?")) {
                localStorage.removeItem("token");
                localStorage.removeItem("user");
                localStorage.removeItem("role");
                window.location.href = "login.html";
            }
        }

        // Mostrar mensaje de éxito
        function mostrarMensajeExito() {
            const msg = document.getElementById("mensajeExito");
            msg.classList.remove("hidden");
            setTimeout(() => {
                msg.classList.add("hidden");
            }, 3000);
        }

        // Mostrar error
        function mostrarError(mensaje) {
            document.getElementById("perfilContainer").innerHTML = `
                <div class="bg-red-50 border border-red-200 text-red-700 p-4 rounded-xl">
                    <p>${mensaje}</p>
                    <button onclick="cargarPerfil()" class="mt-2 text-sm underline">Reintentar</button>
                </div>
            `;
        }

        // Escapar HTML
        function escapeHtml(str) {
            if (!str) return '';
            return str.replace(/[&<>]/g, function(m) {
                if (m === '&') return '&amp;';
                if (m === '<') return '&lt;';
                if (m === '>') return '&gt;';
                return m;
            });
        }

        // Función apiFetch del frontend
        async function apiFetch(url, options = {}) {
            const token = localStorage.getItem("token");
            const headers = {
                "Content-Type": "application/json",
                ...(token && { "Authorization": `Bearer ${token}` }),
                ...options.headers
            };
            const response = await fetch(url, { ...options, headers });
            if (response.status === 401) {
                localStorage.removeItem("token");
                window.location.href = "/login.html";
            }
            return response;
        }

        // Inicializar
        cargarPerfil();
    </script>
</body>
</html>
